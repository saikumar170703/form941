version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: efile941_app
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/efile941_db
      - DB_USER=postgres
      - DB_PASS=root
      - IRS_MEF_EFIN=10-1234
      - IRS_MEF_ETIN=12345
      - AUTHORIZENET_ENVIRONMENT=SANDBOX
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: efile941_db
    environment:
      POSTGRES_DB: efile941_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d efile941_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
