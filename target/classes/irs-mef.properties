# ==============================================================================
#                  IRS FORM 941 & MeF TRANSMISSION PROPERTIES
# ==============================================================================
# Note: Tax rates, wage caps, and tax years are dynamically fetched from 
# PostgreSQL database tables (tax_rates, tax_years).
# This properties file contains ONLY IRS e-file transmitter credentials,
# gateway settings, and Authorize.Net payment credentials.

# ------------------------------------------------------------------------------
# 1. IRS MeF TRANSMISSION CREDENTIALS & SOFTWARE IDENTIFICATION
# ------------------------------------------------------------------------------
# Electronic Filing Identification Number (EFIN)
irs.mef.efin=10-1234

# Electronic Transmitter Identification Number (ETIN)
irs.mef.etin=12345

# Digital Guardian Verification Response PIN (DGVR PIN)
irs.mef.dgvrPin=54321

# IRS Approved Software Identifier
irs.mef.softwareId=SW941APP2026

# Return & Form Schema Version
irs.mef.returnVersion=2026v4.0
irs.mef.formVersion=2026v1.0
irs.mef.namespace=http://www.irs.gov/efile

# ------------------------------------------------------------------------------
# 2. IRS MeF GATEWAY ENDPOINTS & ENVIRONMENT
# ------------------------------------------------------------------------------
# Toggle Production vs Testing Mode (false = ATS Testing Gateway, true = Production Gateway)
irs.mef.useProduction=false

# ATS Testing Endpoint URL
irs.mef.endpoint.ats=https://mefats.irs.gov/mefv2/services/MefSubmissionService

# Production Endpoint URL
irs.mef.endpoint.production=https://mef.irs.gov/mefv2/services/MefSubmissionService

# ------------------------------------------------------------------------------
# 3. AUTHORIZE.NET PAYMENT GATEWAY CONFIGURATION
# ------------------------------------------------------------------------------
# Authorize.Net API Login ID (Obtain from Authorize.Net Merchant Portal)
authorizenet.apiLoginId=API_LOGIN_ID_HERE

# Authorize.Net Transaction Key (Obtain from Authorize.Net Merchant Portal)
authorizenet.transactionKey=TRANSACTION_KEY_HERE

# Authorize.Net Public Client Key (For Accept.js / Frontend JS)
authorizenet.clientKey=CLIENT_KEY_HERE

# Authorize.Net Environment (SANDBOX or PRODUCTION)
authorizenet.environment=SANDBOX

# Form 941 E-Filing Service Fee ($)
authorizenet.filingFee=19.99
