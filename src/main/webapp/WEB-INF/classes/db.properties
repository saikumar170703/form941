# Database Connection Properties with Environment Variable Overrides
db.driver=${DB_DRIVER:org.postgresql.Driver}
db.url=${DB_URL:jdbc:postgresql://localhost:5432/941_newdb}
db.username=${DB_USER:postgres}
db.password=${DB_PASS:root}

# HikariCP Connection Pool Options
db.hikari.maximumPoolSize=${DB_MAX_POOL_SIZE:20}
db.hikari.minimumIdle=${DB_MIN_IDLE:5}
db.hikari.idleTimeout=${DB_IDLE_TIMEOUT:300000}
db.hikari.connectionTimeout=${DB_CONN_TIMEOUT:30000}
